name: Tourism Package MLOps Pipeline

on:
  # Triggers the workflow on push events to the main branch
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ml_pipeline:
    runs-on: ubuntu-latest
    
    # Required permissions to allow GitHub Actions to push code back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so git push works correctly

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        working-directory: ./TourismPredictionProject
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Machine Learning Steps
        working-directory: ./TourismPredictionProject
        run: |
          # Note: Replace 'app.py' with your actual pipeline execution script if different
          # (e.g., python data_prep.py && python train.py)
          python app.py
        env:
          # Assuming you need your Hugging Face token for the dataset/model hub operations
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 

      - name: Commit and Push Updates to Main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage all new or modified files
          git add .
          
          # Commit only if there are changes to avoid workflow errors
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated artifact updates from MLOps pipeline"
          
          # Push the updates back to the main branch
          git push origin main
