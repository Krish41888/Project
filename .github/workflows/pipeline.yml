name: MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  mlops-pipeline:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TourismPredictionProject

    steps:

    # Step 1 - Checkout Repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2 - Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 3 - Upgrade pip
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip

    # Step 4 - Install Dependencies
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    # Step 5 - Verify Project Files
    - name: Verify Files
      run: |
        pwd
        ls -la

    # Step 6 - Verify Model File
    - name: Verify Model
      run: |
        test -f bagging_best_model.pkl
        echo "Model Found"

    # Step 7 - Verify Dataset
    - name: Verify Dataset
      run: |
        test -f tourism_train.csv
        test -f tourism_test.csv
        echo "Dataset Found"

    # Step 8 - Import Application
    - name: Validate Application
      run: |
        python -c "import app; print('Application Loaded Successfully')"

    # Step 9 - Pipeline Completed
    - name: Pipeline Completed
      run: |
        echo "MLOps Pipeline Executed Successfully"
